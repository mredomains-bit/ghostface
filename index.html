<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostface Playlist</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #e63946;
    --dark: #0a0a0a;
    --mid: #141414;
    --surface: #1c1c1c;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #666;
  }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: 1fr 280px;
    grid-template-areas:
      "header header"
      "main   sidebar"
      "controls controls";
  }

  header {
    grid-area: header;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 1.5rem;
  }

  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 0.05em;
    color: var(--red);
    line-height: 1;
  }

  .meta {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .progress-bar-wrap {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: var(--muted);
  }

  .progress-bar {
    width: 140px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--red);
    transition: width 0.3s ease;
    width: 0%;
  }

  main {
    grid-area: main;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .clip-label {
    position: absolute;
    bottom: 1rem;
    left: 1rem;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    background: rgba(0,0,0,0.7);
    padding: 4px 8px;
    border-radius: 2px;
  }

  aside {
    grid-area: sidebar;
    border-left: 1px solid var(--border);
    overflow-y: auto;
    font-size: 11px;
  }

  aside::-webkit-scrollbar { width: 4px; }
  aside::-webkit-scrollbar-track { background: var(--dark); }
  aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .sidebar-header {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    position: sticky;
    top: 0;
    background: var(--mid);
    z-index: 1;
  }

  .playlist-item {
    padding: 0.5rem 1rem;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.1s;
    color: var(--muted);
  }

  .playlist-item:hover { background: var(--surface); color: var(--text); }

  .playlist-item.active {
    background: var(--surface);
    color: var(--text);
    border-left: 2px solid var(--red);
  }

  .item-num {
    font-size: 10px;
    color: var(--muted);
    min-width: 24px;
    text-align: right;
  }

  .item-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
  }

  .item-playing {
    color: var(--red);
    font-size: 9px;
  }

  .controls {
    grid-area: controls;
    border-top: 1px solid var(--border);
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--mid);
  }

  button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 6px 14px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: background 0.15s, border-color 0.15s;
  }

  button:hover { background: var(--surface); border-color: var(--muted); }
  button.active { border-color: var(--red); color: var(--red); }

  .speed-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 5px 8px;
    cursor: pointer;
  }

  .spacer { flex: 1; }

  .clip-counter {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<header>
  <h1>Ghostface</h1>
  <span class="meta">246 CLIPS &bull; PLAYLIST</span>
  <div class="progress-bar-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <span id="progressText">0%</span>
  </div>
</header>

<main>
  <video id="vid" autoplay playsinline></video>
  <div class="clip-label" id="clipLabel"></div>
</main>

<aside>
  <div class="sidebar-header">Queue</div>
  <div id="playlist"></div>
</aside>

<div class="controls">
  <button id="btnPrev" onclick="go(-1)">&#9664; PREV</button>
  <button id="btnPlayPause" onclick="togglePause()">&#10074;&#10074; PAUSE</button>
  <button id="btnNext" onclick="go(1)">NEXT &#9654;</button>
  <button id="btnShuffle" onclick="toggleShuffle()">SHUFFLE</button>
  <button id="btnLoop" onclick="toggleLoop()" class="active">LOOP ALL</button>
  <span class="spacer"></span>
  <span class="speed-label">SPEED</span>
  <select id="speedSelect" onchange="setSpeed(this.value)">
    <option value="0.5">0.5x</option>
    <option value="1" selected>1x</option>
    <option value="1.5">1.5x</option>
    <option value="2">2x</option>
  </select>
  <span class="clip-counter" id="counter">1 / 246</span>
</div>

];

let order = [...FILES.keys()];
let current = 0;
let shuffled = false;
let looping = true;
let paused = false;

const vid = document.getElementById('vid');
const playlistEl = document.getElementById('playlist');
const counter = document.getElementById('counter');
const clipLabel = document.getElementById('clipLabel');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');

function buildPlaylist() {
  playlistEl.innerHTML = '';
  order.forEach((fileIdx, pos) => {
    const name = FILES[fileIdx].replace(/_v\d+\.webm$/, '').replace(/_/g, ' ');
    const div = document.createElement('div');
    div.className = 'playlist-item' + (pos === current ? ' active' : '');
    div.id = 'item-' + pos;
    div.innerHTML = `<span class="item-num">${pos + 1}</span><span class="item-name">${name}</span>${pos === current ? '<span class="item-playing">&#9654;</span>' : ''}`;
    div.onclick = () => { current = pos; loadCurrent(); };
    playlistEl.appendChild(div);
  });
}

function updatePlaylist() {
  document.querySelectorAll('.playlist-item').forEach((el, i) => {
    el.className = 'playlist-item' + (i === current ? ' active' : '');
    el.innerHTML = `<span class="item-num">${i + 1}</span><span class="item-name">${el.querySelector('.item-name').textContent}</span>${i === current ? '<span class="item-playing">&#9654;</span>' : ''}`;
  });
  const active = document.getElementById('item-' + current);
  if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function loadCurrent() {
  const fileIdx = order[current];
  const file = FILES[fileIdx];
  vid.src = BASE + file;
  vid.playbackRate = parseFloat(document.getElementById('speedSelect').value);
  vid.play();
  paused = false;
  document.getElementById('btnPlayPause').textContent = '⏸ PAUSE';
  const name = file.replace(/_v\d+\.webm$/, '').replace(/_/g, ' ');
  clipLabel.textContent = name;
  counter.textContent = (current + 1) + ' / ' + order.length;
  const pct = Math.round(((current + 1) / order.length) * 100);
  progressFill.style.width = pct + '%';
  progressText.textContent = pct + '%';
  updatePlaylist();
}

function go(dir) {
  current = (current + dir + order.length) % order.length;
  loadCurrent();
}

function togglePause() {
  if (paused) { vid.play(); paused = false; document.getElementById('btnPlayPause').textContent = '⏸ PAUSE'; }
  else { vid.pause(); paused = true; document.getElementById('btnPlayPause').textContent = '▶ PLAY'; }
}

function toggleShuffle() {
  shuffled = !shuffled;
  document.getElementById('btnShuffle').classList.toggle('active', shuffled);
  if (shuffled) {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
  } else {
    order = [...FILES.keys()];
  }
  current = 0;
  buildPlaylist();
  loadCurrent();
}

function toggleLoop() {
  looping = !looping;
  document.getElementById('btnLoop').classList.toggle('active', looping);
}

function setSpeed(val) {
  vid.playbackRate = parseFloat(val);
}

vid.addEventListener('ended', () => {
  if (current < order.length - 1) {
    current++;
    loadCurrent();
  } else if (looping) {
    current = 0;
    loadCurrent();
  }
});

buildPlaylist();
loadCurrent();
</script>
</body>
</html>
